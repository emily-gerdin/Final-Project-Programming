# =============================================================================
# .streamlit/config.toml
# -----------------------------------------------------------------------------
# "The Top Reviewed NYC Airbnb Travel Guide" -- the design system.
#
# Everything Streamlit can theme natively lives here instead of in injected
# CSS, so the look survives upgrades and applies to widgets that streamlit
# renders in iframes-free shadow roots (sliders, toggles, tabs, dataframes...).
#
# Aesthetic: high-end editorial magazine, dark only
# -------------------------------------------------
# * Near-black canvas (#0A0A0A), off-white display type (#F5F5F5), muted grey
#   body copy (#A0A0A0) -- the palette of a printed art book, not a dashboard.
# * Bodoni Moda (a Didone, the same family of typefaces as Vogue/Harper's
#   Bazaar) carries every heading; Montserrat at weight 300, letter-spaced,
#   carries body copy, labels and buttons.
# * Hairline rules (rgba(255,255,255,0.16)) instead of filled surfaces, square
#   corners, and generous vertical rhythm -- the "cinematic and spacious" feel
#   comes from whitespace, not from decoration.
#
# The theme is pinned to dark (``base = "dark"``) because the identity *is* the
# dark canvas; the settings menu therefore cannot flip the app to a washed-out
# light mode. There is no ``[theme.dark]``/``[theme.light]`` override block for
# the same reason: every token below applies unconditionally.
#
# Colours are also mirrored in config.py (UI_PALETTE) for the few places that
# need them in Python: the pydeck satellite style JSON and the inline icons.
# Keep the two files in sync if the palette changes.
# =============================================================================

[theme]
base = "dark"

# --- Brand ------------------------------------------------------------------
# No chromatic accent: on an editorial page the *type* is the accent, and a
# neutral off-white keeps sliders, toggles and tab underlines reading as
# hairline detail rather than as UI chrome.
primaryColor = "#F5F5F5"              # controls, slider thumbs, active tab rule
backgroundColor = "#0A0A0A"           # near-black page canvas
secondaryBackgroundColor = "#121212"  # inputs, code blocks, bordered containers
textColor = "#F5F5F5"                 # headings and lead copy
linkColor = "#F5F5F5"
linkUnderline = true

# --- Typography --------------------------------------------------------------
# Both families are named here too, so native widgets rendered by Streamlit's
# own components pick up the same character. The authoritative @font-face rules
# live in app.py (_EDITORIAL_CSS), which declares one latin face per weight --
# Bodoni 400, Bodoni italic 500, Montserrat 300/400 -- under the app's own
# family names. That is deliberate: it keeps the display serif independent of
# whatever face set the theme URLs generate.
# Offline, the stacks fall back to Didot / Bodoni 72 (macOS) or Georgia.
headingFont = "Bodoni Moda:https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap"
font = "Montserrat:https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap"
baseFontSize = 15
baseFontWeight = 300                  # thin body weight, echoed with spacing in app.py
metricValueFontSize = "2rem"
metricValueFontWeight = 400           # the metric number is a display serif

# --- Headings ----------------------------------------------------------------
# Normal/light display weights: a Didone derives its drama from stroke contrast,
# not from weight, so bold would make it shout. h1 is the hero title; it is
# tight-leaded (0.95), left-aligned and uppercased in app.py.
headingFontSizes = ["3rem", "2.1rem", "1.45rem", "1.05rem"]
headingFontWeights = [400, 400, 400, 400]

# --- Spacing / chrome --------------------------------------------------------
# Square corners everywhere: rounded cards read as "app", not "magazine".
baseRadius = "0"
buttonRadius = "0"
borderColor = "#2A2A2A"              # native borders (inputs, dividers, containers)
showWidgetBorder = true
showSidebarBorder = true
dataframeBorderColor = "#2A2A2A"
dataframeHeaderBackgroundColor = "#121212"

# --- Chart colour system ------------------------------------------------------
# Charts follow the editorial palette: an ink-to-paper sequential scale (blacks
# through warm greys to off-white) for heatmaps and the correlation matrix, and
# a low-saturation categorical set whose only chromatic notes are a dusty slate
# and a muted brass -- they read as "printed", not "dashboard".
chartCategoricalColors = [
    "#F5F5F5", "#D9D9D9", "#B0B0B0", "#8A8A8A", "#C9B79C",
    "#7F8C8D", "#A0A0A0", "#6E6E6E", "#4A4A4A", "#E8DCCB",
]
# Sequential: near-black -> off-white, matching the review-count gradient on
# the map legend (--review-low / --review-high in app.py).
chartSequentialColors = [
    "#0A0A0A", "#1C1C1C", "#2E2E2E", "#414141", "#545454",
    "#676767", "#7A7A7A", "#8D8D8D", "#A0A0A0", "#F5F5F5",
]
chartDivergingColors = [
    "#7F8C8D", "#6A7373", "#555B5B", "#3F4343", "#2A2A2A",
    "#3A3A3A", "#5C5449", "#7D7263", "#A0906F", "#C9B79C",
]

[theme.sidebar]
backgroundColor = "#0A0A0A"           # sidebar is the same paper as the page
secondaryBackgroundColor = "#121212"

[browser]
# The tab title/description live in st.set_page_config; this sets the
# favicon-free fallback gather interval so the app stays light on CPU.
gatherUsageStats = false
